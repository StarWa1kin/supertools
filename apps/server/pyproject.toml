[project]
name = "supertools-server"
version = "0.1.0"
description = "API service for the Supertools mini program"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.116.1",
  "httpx>=0.28.1",
  "pydantic-settings>=2.10.1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "ruff>=0.12.5",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "~/.cache/supertools-ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: supertools-server:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,api.weixin.qq.com}
    # Lets outbound Python requests reach a proxy running on the Docker host.
    # Use host.docker.internal (not 127.0.0.1) in HTTP(S)_PROXY.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - supertools-data:/var/lib/supertools
    # Joins the separately deployed media-parse stack so MEDIA_PARSER_BASE_URL
    # can use http://media-parse:8051 without exposing the parser on the host.
    networks:
      - default
      - media-parse
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HTTP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.devhooks.cn}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,api.weixin.qq.com}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    image: supertools-admin:latest
    restart: unless-stopped
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  supertools-data:
    name: supertools-data

networks:
  media-parse:
    external: true
    name: ${MEDIA_PARSE_NETWORK:-media-parse_default}

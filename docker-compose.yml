services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: supertools-server:latest
    restart: unless-stopped
    env_file:
      - .env.production
    # Lets outbound Python requests reach a proxy running on the Docker host.
    # Use host.docker.internal (not 127.0.0.1) in HTTP(S)_PROXY.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - supertools-data:/var/lib/supertools
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HTTP_PORT:-8000}:8000"
    depends_on:
      deployer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.devhooks.cn}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,deployer}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    image: supertools-admin:latest
    restart: unless-stopped
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  deployer:
    build:
      context: .
      dockerfile: apps/deployer/Dockerfile
    image: supertools-deployer:latest
    restart: unless-stopped
    environment:
      DEPLOY_REPOSITORY: /workspace
      DEPLOY_COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-supertools}
      DEPLOY_SERVICE_TOKEN: ${DEPLOY_SERVICE_TOKEN:?DEPLOY_SERVICE_TOKEN is required}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,deployer}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DEPLOY_SSH_DIR:-/root/.ssh}:/root/.ssh:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  supertools-data:
    name: supertools-data
